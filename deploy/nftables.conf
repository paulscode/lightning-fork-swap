#!/usr/sbin/nft -f
# Lightning Fork Swap host firewall: inbound SSH, HTTP(S) and Lightning only.
#
# Only this table is replaced, never the whole ruleset: Docker keeps its own
# tables for the containers, and a "flush ruleset" here would wipe them.
table inet lfswap
delete table inet lfswap

table inet lfswap {
	# CVE-2026-98432: the kernel's IPv4 TCP handshake can read freed memory
	# when a SYN carries IP options. Drop every IPv4 packet with options
	# (a header longer than 5 words) before anything else sees it, which
	# covers 9735 on its way to Docker as well as the host's own ports.
	# Ordinary traffic carries none. Keep until the host runs a fixed kernel
	# (Debian 12: linux 6.1.190-1 or later).
	chain prerouting {
		type filter hook prerouting priority raw; policy accept;
		ip hdrlength != 5 drop
	}

	chain input {
		type filter hook input priority filter; policy drop;
		iif lo accept
		ct state established,related accept
		ct state invalid drop
		meta l4proto { icmp, ipv6-icmp } accept
		tcp dport { 22, 80, 443 } accept
		# Lightning reaches lnd through Docker's port mapping (forward, not
		# input), so 9735 needs no rule here.
		# Containers talking to the host (none do at present).
		iifname "br-*" accept
		iifname "docker0" accept
	}
}
