# Lightning Fork Swap on one small VPS.
#
# Everything but nginx (on the host, with certbot) runs here, on one private
# network. Nothing is published to the internet except Lightning's 9735; the
# API ports are bound to 127.0.0.1 for the host's nginx.
#
# State lives under ${LFSWAP_ROOT} (default /srv/lfswap); secrets under
# ${LFSWAP_ROOT}/secrets. scripts/setup.sh renders the config files.

name: lfswap

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  # Fails when this host's state has been migrated to another host
  # (scripts/migrate/export.sh leaves a tombstone), so that nothing, lnd
  # above all, starts here again by accident.
  guard:
    image: lfswap/knots:29.4.2
    security_opt: [no-new-privileges:true]
    entrypoint: ["sh", "-c", "if [ -f /srv/MIGRATED ]; then echo 'this host was migrated away:'; cat /srv/MIGRATED; exit 1; fi"]
    volumes:
      - ${LFSWAP_ROOT:-/srv/lfswap}:/srv:ro
    restart: "no"

  knots:
    image: lfswap/knots:29.4.2
    security_opt: [no-new-privileges:true]
    build: ./knots
    restart: unless-stopped
    depends_on:
      guard: {condition: service_completed_successfully}
    stop_grace_period: 5m
    volumes:
      - ${LFSWAP_ROOT:-/srv/lfswap}/knots/data:/data
    logging: *logging
    mem_limit: 900m
    # If the host runs out of memory, the kernel picks something else first
    oom_score_adj: -300

  shim:
    image: lfswap/txindex-shim:dev
    security_opt: [no-new-privileges:true]
    build: ../shim
    restart: unless-stopped
    depends_on: [knots]
    environment:
      SHIM_UPSTREAM: http://knots:8332/
      SHIM_RPCUSER: shim
      SHIM_RPCPASSWORD: ${SHIM_RPCPASSWORD:?run scripts/setup.sh}
      SHIM_DB: /data/txindex.db
      # 60 days; the pruned node keeps about 19,000 blocks at prune=5000.
      SHIM_WINDOW: "8640"
      # The backend connects to ZMQ at its RPC host, which is this shim.
      SHIM_FORWARD: 28332=knots:28332,28333=knots:28333
    volumes:
      - ${LFSWAP_ROOT:-/srv/lfswap}/shim:/data
    logging: *logging
    mem_limit: 128m

  # Tor's control port can take the node's onion service down or reroute its
  # traffic: only lnd reaches Tor (network "tor"), and Tor reaches the
  # internet through a network of its own
  tor:
    image: lfswap/tor:dev
    security_opt: [no-new-privileges:true]
    build: ./tor
    restart: unless-stopped
    networks: [tor, tor_egress]
    volumes:
      - ${LFSWAP_ROOT:-/srv/lfswap}/tor/torrc:/etc/tor/torrc:ro
      - ${LFSWAP_ROOT:-/srv/lfswap}/tor/data:/var/lib/tor
    logging: *logging
    mem_limit: 128m

  lnd:
    image: paulscode/lightning-fork:0.21.3-beta-blake2b.17@sha256:1922383540d5545d67f0089149254eb0a23360e73c9d754b85f061a6485596f6
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 2m
    depends_on:
      guard: {condition: service_completed_successfully}
      knots: {condition: service_started}
      tor: {condition: service_started}
    networks:
      default: {}
      # A fixed address: Tor forwards the node's onion service to it
      # (tor.targetipaddress in lnd.conf)
      tor: {ipv4_address: 172.30.90.10}
    ports:
      - "9735:9735"
      - "127.0.0.1:10009:10009"
      - "127.0.0.1:8080:8080"
    volumes:
      - ${LFSWAP_ROOT:-/srv/lfswap}/lnd:/root/.lnd
    logging: *logging
    mem_limit: 512m
    # lnd last of all: killed mid-update it can need a force close
    oom_score_adj: -500
    # Healthy once its RPC server answers: the backend skips an lnd that is
    # still starting, and never tries it again until it restarts itself
    healthcheck:
      test: ["CMD-SHELL", "lncli --network=${NETWORK:-mainnet} getinfo >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15m
      start_interval: 5s

  postgres:
    # By digest: a move copies the data directory, which needs the same major
    # version on both hosts.
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    environment:
      POSTGRES_DB: boltz
      POSTGRES_USER: boltz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/setup.sh}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40"]
    volumes:
      - ${LFSWAP_ROOT:-/srv/lfswap}/postgres:/var/lib/postgresql
    logging: *logging
    mem_limit: 256m

  boltz:
    image: lfswap/boltz:dev
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 1m
    depends_on:
      guard: {condition: service_completed_successfully}
      postgres: {condition: service_started}
      shim: {condition: service_started}
      lnd: {condition: service_healthy}
    environment:
      NODE_OPTIONS: --max-old-space-size=384
    command: ["--configpath", "/boltz/boltz.conf", "--datadir", "/boltz"]
    ports:
      - "127.0.0.1:9001:9001"  # boltzd REST API
      - "127.0.0.1:9004:9004"  # sidecar WebSocket
      - "127.0.0.1:9005:9005"  # sidecar REST API
    volumes:
      - ${LFSWAP_ROOT:-/srv/lfswap}/boltz:/boltz
      - ${LFSWAP_ROOT:-/srv/lfswap}/lnd/tls.cert:/lnd/tls.cert:ro
      # lnd's calls the backend makes and no others (scripts/bake-macaroon.sh);
      # missing, the backend does not start rather than run on a directory
      - type: bind
        source: ${LFSWAP_ROOT:-/srv/lfswap}/lnd/boltz.macaroon
        target: /lnd/boltz.macaroon
        read_only: true
        bind: {create_host_path: false}
    logging: *logging
    mem_limit: 700m

  # The donation watcher: finds donations in lnd's wallet and checks each
  # for replay protection (../donations). Reads lnd with a macaroon that
  # may only list transactions; owns the donations database.
  donations-worker:
    image: lfswap/donations:dev
    build: ../donations
    security_opt: [no-new-privileges:true]
    read_only: true
    restart: unless-stopped
    command: ["worker"]
    depends_on:
      guard: {condition: service_completed_successfully}
      postgres: {condition: service_started}
      lnd: {condition: service_healthy}
    environment:
      DONATIONS_DB_URL: postgres://donations_worker:${DONATIONS_WORKER_DBPASSWORD:?run scripts/setup.sh}@postgres:5432/donations?sslmode=disable
      LND_REST_URL: https://lnd:8080
      LND_TLS_CERT: /lnd/tls.cert
      LND_MACAROON: /lnd/donations.macaroon
      DONATION_ADDRESSES: ${DONATION_ADDRESS:-}
      # Esplora APIs; empty: mempool.guide, and mempool.space then
      # blockstream.info (the donations service's defaults)
      BLAKE2B_EXPLORERS: ${DONATIONS_BLAKE2B_EXPLORERS:-}
      SHA256_EXPLORERS: ${DONATIONS_SHA256_EXPLORERS:-}
    volumes:
      - ${LFSWAP_ROOT:-/srv/lfswap}/lnd/tls.cert:/lnd/tls.cert:ro
      - type: bind
        source: ${LFSWAP_ROOT:-/srv/lfswap}/lnd/donations.macaroon
        target: /lnd/donations.macaroon
        read_only: true
        bind: {create_host_path: false}
    logging: *logging
    mem_limit: 64m

  # The donations API for the web app (/donate/v1/ through nginx): reads
  # the database with a role that may only read; no macaroon
  donations-api:
    image: lfswap/donations:dev
    security_opt: [no-new-privileges:true]
    read_only: true
    restart: unless-stopped
    command: ["api"]
    depends_on:
      postgres: {condition: service_started}
    environment:
      DONATIONS_DB_URL: postgres://donations_api:${DONATIONS_API_DBPASSWORD:?run scripts/setup.sh}@postgres:5432/donations?sslmode=disable
      LISTEN: ":9010"
    ports:
      - "127.0.0.1:9010:9010"
    logging: *logging
    mem_limit: 64m

networks:
  default: {}
  # lnd and Tor only, no way out; a fixed subnet for torrc's SocksPolicy
  tor:
    internal: true
    ipam:
      config:
        - subnet: 172.30.90.0/24
  tor_egress: {}
