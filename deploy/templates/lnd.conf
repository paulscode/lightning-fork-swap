# Lightning Fork for Lightning Fork Swap. Rendered by scripts/setup.sh.
[Application Options]
alias=Lightning Fork Swap
color=#4e93ff
listen=0.0.0.0:9735
externalip=${PUBLIC_IP}:9735
rpclisten=0.0.0.0:10009
restlisten=0.0.0.0:8080
tlsextradomain=lnd
tlsextraip=127.0.0.1
wallet-unlock-password-file=/root/.lnd/wallet-password
wallet-unlock-allow-create=true
maxpendingchannels=5
# Channels opened to this node: at least 1,000,000 sat. Smaller ones carry
# too little of a swap to be worth their place (half the network's channels
# are smaller, but those are mostly between small nodes)
minchansize=1000000
# Channels above 0.167 BTC ("wumbo") are allowed with peers that allow them.
protocol.wumbo-channels=true
# No keysend payments: the node is paid through invoices only.
accept-keysend=false
debuglevel=info

[Bitcoin]
bitcoin.${NETWORK}=true
${LND_NETWORK_EXTRA}
bitcoin.node=bitcoind
# Confirmations before a channel opened to us is used. A channel can carry
# as much as it holds, up to all our outbound and the hot wallet (through
# reverse swaps); on a chain this size, a reorg of a few blocks is within
# reach. lnd would scale this to the channel's size; the flat value applies
# to every size, so it must be the safe one.
bitcoin.defaultchanconfs=6
# Routing fees of new channels: 1 sat + 500 ppm (0.05 %). Forwarding moves
# the liquidity swaps use, so it is priced, below the swap fee. Existing
# channels: lncli updatechanpolicy.
bitcoin.basefee=1000
bitcoin.feerate=500

[Bitcoind]
bitcoind.rpchost=knots:8332
bitcoind.rpcuser=lnd
bitcoind.rpcpass=${LND_RPCPASSWORD}
bitcoind.zmqpubrawblock=tcp://knots:28332
bitcoind.zmqpubrawtx=tcp://knots:28333
bitcoind.estimatemode=ECONOMICAL

[tor]
# Hybrid: clearnet peers directly, onion-only peers through Tor, and an onion
# address of our own alongside the clearnet one.
tor.active=true
tor.socks=tor:9050
tor.control=tor:9051
tor.password=${TOR_CONTROL_PASSWORD}
tor.v3=true
tor.skip-proxy-for-clearnet-targets=true
tor.privatekeypath=/root/.lnd/v3_onion_private_key

[routing]
routing.strictgraphpruning=false

[invoices]
# lnd cancels a held invoice this many blocks before its earliest HTLC
# expires. The backend refuses to lock up a reverse swap unless the HTLCs
# outlast the lockup's timeout by this many blocks plus 12 for its refund to
# confirm, counting on this value; it is lnd's default, set here so that it
# stays so. Raising it would need the backend changed too.
invoices.holdexpirydelta=18

[sweeper]
# Our own payments' HTLCs, when a peer holds one to its expiry, are swept
# with no deadline lnd knows of; by default lnd then aims to confirm within
# 1008 blocks. The backend keeps cltvDelta (144) blocks between such an
# HTLC's expiry and the swap's refund: aim to confirm within that.
sweeper.nodeadlineconftarget=144

[healthcheck]
healthcheck.chainbackend.attempts=5
