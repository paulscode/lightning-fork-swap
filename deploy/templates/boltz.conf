# Lightning Fork Swap: Boltz backend for the Bitcoin BLAKE2b chain, BTC only.
# Rendered by scripts/setup.sh; the pair settings come from deploy/.env.
network = "${NETWORK}"
loglevel = "info"
datadir = "/boltz"
mnemonicpath = "/boltz/seed.dat"
mnemonicpathEvm = "/boltz/seed.dat"

[api]
host = "0.0.0.0"
port = 9001

[grpc]
host = "127.0.0.1"
port = 9000

[postgres]
host = "postgres"
port = 5432
database = "boltz"
username = "boltz"
password = "${POSTGRES_PASSWORD}"

[sidecar]
dataDir = "/boltz/sidecar"

  [sidecar.grpc]
  host = "127.0.0.1"
  port = 9003

  [sidecar.ws]
  host = "0.0.0.0"
  port = 9004

    # Without a limit, a connection may send subscriptions as fast as it
    # likes, each id a database lookup; the app sends a few a minute
    [sidecar.ws.messageLimit]
    messagesPerMinutePerConnection = 30
    maxSwapUpdateIdsPerMessage = 20

  [sidecar.api]
  host = "0.0.0.0"
  port = 9005

[swap]
# Claim each submarine swap on its own. Batched claims are cheaper, but a
# batch that cannot be broadcast is retried whole, so one unclaimable lockup
# would hold up every other claim.
deferredClaimSymbols = []
# Blocks kept between a submarine swap's Lightning payment timing out and its
# on-chain refund becoming possible: time for our node to get its HTLC
# timeout transactions confirmed if a peer holds the payment to the end.
# lnd aims to confirm those within sweeper.nodeadlineconftarget (lnd.conf),
# which may not be lower than 144.
cltvDelta = 144

[[pairs]]
base = "BTC"
quote = "BTC"
rate = 1
swapTypes = ["submarine", "reverse"]
# Percent. `fee` is the reverse swap fee, `swapInFee` the submarine one.
fee = ${REVERSE_FEE_PERCENT}
swapInFee = ${SUBMARINE_FEE_PERCENT}
minSwapAmount = ${MIN_SWAP_SAT}
maxSwapAmount = ${MAX_SWAP_SAT}

  # Minutes; the chain targets ten-minute blocks as Bitcoin does.
  [pairs.timeoutDelta]
  # chain swaps are off (swapTypes); the sidecar still wants the key
  chain = 1440
  reverse = 1440
  swapMinimal = 1440
  swapMaximal = 2880
  # Submarine swaps: the user's refund waits this long when a swap fails,
  # and a payment of ours can be held at most this long less cltvDelta
  swapTaproot = 4320

[[currencies]]
symbol = "BTC"
network = "${BOLTZ_CURRENCY_NETWORK}"
minWalletBalance = 0
minSwapAmount = ${MIN_SWAP_SAT}
maxSwapAmount = ${MAX_SWAP_SAT}
# Never accept an unconfirmed lockup as final.
maxZeroConfAmount = 0
# A lockup is paid against only once this deep: a short reorganisation must
# not be able to take it back after the invoice has been paid.
requiredConfirmations = 3

  [currencies.chain]
  # Through the txindex shim, which stands in for -txindex on the pruned node.
  host = "shim"
  port = 8332
  user = "boltz"
  password = "${BOLTZ_RPCPASSWORD}"
  wallet = "boltz"
  feeFloor = 1

  [[currencies.lnds]]
  host = "lnd"
  port = 10009
  certpath = "/lnd/tls.cert"
  macaroonpath = "/lnd/boltz.macaroon"
