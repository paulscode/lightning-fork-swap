# Lightning Fork Swap: Boltz backend for the Bitcoin BLAKE2b chain, BTC only.
# Rendered by scripts/setup.sh; the pair settings come from deploy/.env.
network = "mainnet"
loglevel = "info"
datadir = "/boltz"
mnemonicpath = "/boltz/seed.dat"
mnemonicpathEvm = "/boltz/seed.dat"

[api]
host = "0.0.0.0"
port = 9001

[grpc]
host = "127.0.0.1"
port = 9000

[postgres]
host = "postgres"
port = 5432
database = "boltz"
username = "boltz"
password = "${POSTGRES_PASSWORD}"

[sidecar]
dataDir = "/boltz/sidecar"

  [sidecar.grpc]
  host = "127.0.0.1"
  port = 9003

  [sidecar.ws]
  host = "0.0.0.0"
  port = 9004

  [sidecar.api]
  host = "0.0.0.0"
  port = 9005

[swap]
deferredClaimSymbols = ["BTC"]

[[pairs]]
base = "BTC"
quote = "BTC"
rate = 1
swapTypes = ["submarine", "reverse"]
# Percent. `fee` is the reverse swap fee, `swapInFee` the submarine one.
fee = ${REVERSE_FEE_PERCENT}
swapInFee = ${SUBMARINE_FEE_PERCENT}
minSwapAmount = ${MIN_SWAP_SAT}
maxSwapAmount = ${MAX_SWAP_SAT}

  # Minutes; the chain targets ten-minute blocks as Bitcoin does.
  [pairs.timeoutDelta]
  reverse = 1440
  swapMinimal = 1440
  swapMaximal = 2880
  swapTaproot = 10080

[[currencies]]
symbol = "BTC"
network = "bitcoinMainnet"
minWalletBalance = 0
minSwapAmount = ${MIN_SWAP_SAT}
maxSwapAmount = ${MAX_SWAP_SAT}
# Never accept an unconfirmed lockup as final.
maxZeroConfAmount = 0

  [currencies.chain]
  # Through the txindex shim, which stands in for -txindex on the pruned node.
  host = "shim"
  port = 8332
  user = "boltz"
  password = "${BOLTZ_RPCPASSWORD}"
  wallet = "boltz"
  feeFloor = 1

  [[currencies.lnds]]
  host = "lnd"
  port = 10009
  certpath = "/lnd/tls.cert"
  macaroonpath = "/lnd/admin.macaroon"
