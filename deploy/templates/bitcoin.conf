# Bitcoin Knots on the Bitcoin BLAKE2b chain, pruned, for Lightning Fork Swap.
# Rendered by scripts/setup.sh; edit the template, not this file.
server=1
prune=5000
txindex=0

# A small VPS: keep memory down.
dbcache=200
maxmempool=100
maxconnections=16
par=1
rpcthreads=8

# RPC and ZMQ for the containers on the private network only.
rpcallowip=172.16.0.0/12
rpcallowip=10.0.0.0/8
${RPCAUTH_LINES}
# The shim's own login reads blocks only (what it forwards for the backend
# carries the backend's login); it must not be able to spend the hot wallet.
# The other users keep every call.
rpcwhitelistdefault=0
rpcwhitelist=shim:getbestblockhash,getblockchaininfo,getblockhash,getblock,getblockheader
zmqpubrawblock=tcp://0.0.0.0:28332
zmqpubrawtx=tcp://0.0.0.0:28333

# The swap service's hot wallet (reverse swap lockups) lives here.
disablewallet=0
fallbackfee=0.00001000
${KNOTS_CHAIN_LINE}

# Options Knots reads per network.
[${KNOTS_SECTION}]
rpcbind=0.0.0.0
rpcport=8332
${KNOTS_NETWORK_EXTRA}
