# Bitcoin Knots on the Bitcoin BLAKE2b chain, pruned, for Lightning Fork Swap.
# Rendered by scripts/setup.sh; edit the template, not this file.
server=1
prune=5000
txindex=0

# A small VPS: keep memory down.
dbcache=200
maxmempool=100
maxconnections=16
par=1
rpcthreads=8

# RPC and ZMQ for the containers on the private network only.
rpcallowip=172.16.0.0/12
rpcallowip=10.0.0.0/8
${RPCAUTH_LINES}
# Logins that must not be able to spend the hot wallet. The shim's own
# login reads blocks only (what it forwards for the backend carries the
# backend's login). lnd gets the node's chain, mempool, fee and network
# reads and sending transactions, no wallet call: what it was seen to call
# on regtest (start, payments, opens, a force close and its sweeps), plus
# the reads it may make otherwise. getinfo does not exist; lnd asks for it
# to learn the node's version and must get "method not found", as without
# a whitelist. The backend and the cookie (the monitor) keep every call.
rpcwhitelistdefault=0
rpcwhitelist=shim:getbestblockhash,getblockchaininfo,getblockhash,getblock,getblockheader
rpcwhitelist=lnd:getbestblockhash,getblock,getblockchaininfo,getblockcount,getblockfilter,getblockhash,getblockheader,getblockstats,getchaintips,getdeploymentinfo,getmempoolancestors,getmempooldescendants,getmempoolentry,getmempoolinfo,getrawmempool,gettxout,gettxoutproof,gettxspendingprevout,verifytxoutproof,waitforblock,waitforblockheight,waitfornewblock,decoderawtransaction,decodescript,getrawtransaction,sendrawtransaction,submitpackage,testmempoolaccept,estimatesmartfee,validateaddress,getindexinfo,getnetworkinfo,getpeerinfo,getnodeaddresses,getconnectioncount,getnettotals,getmininginfo,getnetworkhashps,getzmqnotifications,uptime,help,getrpcinfo,getinfo
zmqpubrawblock=tcp://0.0.0.0:28332
zmqpubrawtx=tcp://0.0.0.0:28333

# The swap service's hot wallet (reverse swap lockups) lives here.
disablewallet=0
fallbackfee=0.00001000
${KNOTS_CHAIN_LINE}

# Options Knots reads per network.
[${KNOTS_SECTION}]
rpcbind=0.0.0.0
rpcport=8332
${KNOTS_NETWORK_EXTRA}
