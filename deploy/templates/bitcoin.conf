# Bitcoin Knots on the Bitcoin BLAKE2b chain, pruned, for Lightning Fork Swap.
# Rendered by scripts/setup.sh; edit the template, not this file.
server=1
prune=5000
txindex=0

# A small VPS: keep memory down.
dbcache=200
maxmempool=100
maxconnections=16
par=1
rpcthreads=8

# RPC and ZMQ for the containers on the private network only.
rpcbind=0.0.0.0
rpcallowip=172.16.0.0/12
rpcallowip=10.0.0.0/8
rpcport=8332
${RPCAUTH_LINES}
zmqpubrawblock=tcp://0.0.0.0:28332
zmqpubrawtx=tcp://0.0.0.0:28333

# The swap service's hot wallet (reverse swap lockups) lives here.
disablewallet=0
fallbackfee=0.00001000
