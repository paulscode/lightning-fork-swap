# Regtest configuration for the end-to-end tests.
network = "regtest"
loglevel = "debug"
datadir = "/boltz"
mnemonicpath = "/boltz/seed.dat"
mnemonicpathEvm = "/boltz/seed.dat"

[api]
host = "0.0.0.0"
port = 9001

[grpc]
host = "127.0.0.1"
port = 9000

[postgres]
host = "postgres"
port = 5432
database = "boltz"
username = "boltz"
password = "boltz"

[sidecar]
dataDir = "/boltz/sidecar"

  [sidecar.grpc]
  host = "127.0.0.1"
  port = 9003

  [sidecar.ws]
  host = "0.0.0.0"
  port = 9004

  [sidecar.api]
  host = "0.0.0.0"
  port = 9005

[swap]
deferredClaimSymbols = ["BTC"]

[[pairs]]
base = "BTC"
quote = "BTC"
rate = 1
swapTypes = ["submarine", "reverse"]
fee = 0.5
swapInFee = 0.5
minSwapAmount = 10000
maxSwapAmount = 1000000

  [pairs.timeoutDelta]
  # chain swaps are off (swapTypes); the sidecar still wants the key
  chain = 1440
  reverse = 1440
  swapMinimal = 1440
  swapMaximal = 2880
  swapTaproot = 10080

[[currencies]]
symbol = "BTC"
network = "bitcoinRegtest"
minWalletBalance = 0
minSwapAmount = 10000
maxSwapAmount = 1000000
maxZeroConfAmount = 0

  [currencies.chain]
  host = "shim"
  port = 8332
  user = "lab"
  password = "lab"
  wallet = "boltz"
  feeFloor = 1

  [[currencies.lnds]]
  host = "lnd-swap"
  port = 10009
  certpath = "/lnd/tls.cert"
  macaroonpath = "/lnd/data/chain/bitcoin/regtest/admin.macaroon"
