# Lightning Fork Swap: the web app, the swap API and an explorer proxy, on
# one origin. The certificate comes from `certbot certonly --webroot -w
# /var/www/html` (see scripts/install-host.sh), renewed by certbot's timer.
#
# The preview password stays on until go-live: /etc/nginx/lfswap-preview.conf
# holds its auth_basic lines; empty that file to open the site.

# Only the API routes the web app uses are reachable; the backend serves many
# more (chain swaps, referrals, node info with private channel ids, ...).
map "$request_method:$uri" $lfswap_api_ok {
    default 0;
    "~^GET:/v2/swap/(submarine|reverse)$"                                      1;
    "~^POST:/v2/swap/(submarine|reverse)$"                                     1;
    "~^GET:/v2/swap/status$"                                                   1;
    "~^GET:/v2/swap/[A-Za-z0-9]{6,32}$"                                        1;
    "~^GET:/v2/swap/submarine/[A-Za-z0-9]{6,32}/(transaction|preimage|claim)$" 1;
    "~^POST:/v2/swap/submarine/[A-Za-z0-9]{6,32}/(refund|claim)$"              1;
    "~^GET:/v2/swap/reverse/[A-Za-z0-9]{6,32}/transaction$"                    1;
    "~^POST:/v2/swap/reverse/[A-Za-z0-9]{6,32}/claim$"                         1;
    "~^GET:/v2/swap/reverse/[A-Za-z0-9]{20,2048}/bip21$"                       1;
    "~^GET:/v2/chain/fees$"                                                    1;
    "~^POST:/v2/chain/BTC/transaction$"                                        1;
}

# The explorer paths the web app uses; the proxy relays nothing else (an open
# relay would get this host's address banned there, and with it refunds).
map "$request_method:$uri" $lfswap_explorer_ok {
    default 0;
    "~^GET:/explorer/api/address/[A-Za-z0-9]{14,100}/utxo$"         1;
    "~^GET:/explorer/api/address/[A-Za-z0-9]{14,100}$"              1;
    "~^GET:/explorer/api/address/[A-Za-z0-9]{14,100}/txs/mempool$"  1;
    "~^GET:/explorer/api/tx/[0-9a-f]{64}/(hex|status)$"             1;
    "~^GET:/explorer/api/tx/[0-9a-f]{64}/outspend/[0-9]{1,5}$"      1;
    "~^GET:/explorer/api/blocks/tip/height$"                        1;
    "~^GET:/explorer/api/(fee-estimates|v1/fees/recommended)$"      1;
    "~^POST:/explorer/api/tx$"                                      1;
}

# The donations API (../donations): its health, a donation's replay
# verdict, and channel donations (their numbers, creating one, its page,
# changing its node)
map "$request_method:$uri" $lfswap_donate_ok {
    default 0;
    "~^GET:/donate/v1/health$"                                    1;
    "~^GET:/donate/v1/replay/[0-9a-f]{64}$"                       1;
    "~^GET:/donate/v1/info$"                                      1;
    "~^POST:/donate/v1/channel-orders$"                           1;
    "~^GET:/donate/v1/channel-orders/[A-Za-z0-9_-]{22}$"          1;
    "~^PATCH:/donate/v1/channel-orders/[A-Za-z0-9_-]{22}/node$"   1;
    "~^GET:/donate/v1/sha256/info$"                               1;
    "~^POST:/donate/v1/sha256$"                                   1;
    "~^GET:/donate/v1/sha256/[A-Za-z0-9_-]{22}$"                  1;
    "~^POST:/donate/v1/sha256/[A-Za-z0-9_-]{22}/tx$"              1;
}

# Who a client is, for the limits: its IPv4 address, or the /64 of its IPv6
# address (one host gets a whole /64, enough addresses to rotate through
# any per-address limit). $binary_remote_addr is 4 or 16 bytes.
map $binary_remote_addr $lfswap_client {
    "~(?s)^(?<lfswap_v6_64>.{8}).{8}$" $lfswap_v6_64;
    default                            $binary_remote_addr;
}

# --- Logs: what they keep about users ---
# The access log carries no client address: a tag instead, an HMAC of the
# address under a key replaced daily (lfswap_privacy.js, scripts/log-key.sh),
# so one day's traffic can be read but not traced to anyone. Paths lose
# their swap ids, txids, addresses and invoices; the user agent is cut to
# its kind. A separate threat log keeps the address of what is hostile:
# scanners, probes of the API, malformed paths; a rate-limited client there
# is only its tag (real users do hit the limits). Retention: the access and
# error logs 10 days, the threat log 30 (logrotate/lfswap, install-host.sh).
js_import lfswap_privacy from /etc/nginx/njs/lfswap_privacy.js;
include /etc/nginx/lfswap-tag-key.conf;
js_set $lfswap_client_tag lfswap_privacy.tag;

# The path as the client asked for it (before try_files sends the app's
# pages to /index.html), without the query
map $request_uri $lfswap_req_path {
    "~^(?<lfswap_rp>[^?]*)" $lfswap_rp;
}

map $lfswap_req_path $lfswap_log_path {
    "~^/v2/swap/(submarine|reverse|status|restore)$"                            $lfswap_req_path;
    "~^/v2/swap/reverse/[^/]+/bip21$"                                            /v2/swap/reverse/:invoice/bip21;
    "~^/v2/swap/(?<lfswap_lt>submarine|reverse)/[^/]+/(?<lfswap_lr>[a-z]+)$"     /v2/swap/$lfswap_lt/:id/$lfswap_lr;
    "~^/v2/swap/[^/]+$"                                                          /v2/swap/:id;
    "~^/v2/(chain/fees|chain/BTC/transaction|ws)$"                               $lfswap_req_path;
    "~^/explorer/api/address/[^/]+(?<lfswap_lr>/[a-z/]*)?$"                     /explorer/api/address/:address$lfswap_lr;
    "~^/explorer/api/tx/[^/]+(?<lfswap_lr>/[a-z]+(/[0-9]+)?)?$"                 /explorer/api/tx/:txid$lfswap_lr;
    "~^/explorer/api/(blocks/tip/height|fee-estimates|v1/fees/recommended|tx)$" $lfswap_req_path;
    "~^/donate/v1/replay/"                                                       /donate/v1/replay/:txid;
    "~^/donate/v1/channel-orders/[^/]+(?<lfswap_lr>/node)?$"                    /donate/v1/channel-orders/:id$lfswap_lr;
    "~^/donate/v1/sha256/[^/]{22}(?<lfswap_lr>/tx)?$"                           /donate/v1/sha256/:id$lfswap_lr;
    "~^/donate/v1/(health|info|channel-orders|sha256|sha256/info)$"              $lfswap_req_path;
    "~^/(assets|graph)/[A-Za-z0-9._/-]{1,100}$"                                  $lfswap_req_path;
    "~^/[A-Za-z0-9._-]{0,40}$"                                                   $lfswap_req_path;
    # Anything else (the app's pages with a swap id in them, probes): its
    # first segment only
    "~^(?<lfswap_ls>/[^/]{0,40})"                                                $lfswap_ls/*;
    default                                                                      /*;
}

map $http_user_agent $lfswap_log_agent {
    default                    other;
    ""                         none;
    "~*bot|crawl|spider|slurp" bot;
    "~^lightningfork-"         lightningfork;
    "~^Go-http-client/"        go;
    "~^curl/"                  curl;
    "~^python"                 python;
    "~Edg/"                    edge;
    "~(Firefox|FxiOS)/"        firefox;
    "~(Chrome|CriOS)/"         chrome;
    "~Safari/"                 safari;
}

# Paths that are never part of the site: what scanners look for
map $lfswap_req_path $lfswap_scanner {
    default                                                                            0;
    "~*\.(php|asp|aspx|jsp|cgi|env|ini|sql|bak|old|git|svn|ds_store|yml|yaml)(/|$)"     1;
    "~*^/(wp-|wordpress|\.git|\.env|\.aws|\.ssh|cgi-bin|phpmyadmin|pma|boaform|actuator|vendor|xmlrpc|owa|hnap1|solr|manager|console|druid|geoserver)" 1;
}

# Hostile: a scanner path, a malformed path (400), or a probe of the API
# outside what the app uses (404 there); and anything a limit refused
map "$status:$lfswap_scanner:$lfswap_req_path" $lfswap_hostile {
    default                         0;
    "~^[0-9]+:1:"                   1;
    "~^400:"                        1;
    "~^404:0:/(v2|explorer|donate)/" 1;
}
map "$lfswap_hostile:$limit_req_status:$limit_conn_status" $lfswap_threat {
    default      0;
    "~^1:"       1;
    "~REJECTED"  1;
}
# Who: the address of the hostile, the tag of the merely too fast
map "$lfswap_hostile:$limit_req_status$limit_conn_status" $lfswap_threat_who {
    "~^0:.*REJECTED" $lfswap_client_tag;
    default          $remote_addr;
}
map "$lfswap_hostile:$limit_req_status$limit_conn_status" $lfswap_threat_path {
    "~^0:.*REJECTED" $lfswap_log_path;
    default          $lfswap_req_path_short;
}
map $lfswap_req_path $lfswap_req_path_short {
    "~^(?<lfswap_rs>.{0,120})" $lfswap_rs;
}
map $http_user_agent $lfswap_agent_short {
    "~^(?<lfswap_as>.{0,150})" $lfswap_as;
}

log_format lfswap_privacy '$time_iso8601 $lfswap_client_tag '
                          '"$request_method $lfswap_log_path $server_protocol" '
                          '$status $body_bytes_sent $request_time '
                          '$upstream_response_time $lfswap_log_agent';
log_format lfswap_threat '$time_iso8601 $lfswap_threat_who $host '
                         '"$request_method $lfswap_threat_path $server_protocol" '
                         '$status "$lfswap_agent_short"';

# A limit's refusals go to the threat log (by tag), not to the error log by
# address; the error log is for nginx's own errors
limit_req_log_level warn;
limit_conn_log_level warn;

# Rate limit swap creation (POST) only; the app polls the same paths with GET.
# Besides each client's limit, one for everyone: no number of addresses
# creates more than that (it can refuse honest users while it trips, so the
# monitor's log alerts are the signal).
map $request_method $lfswap_create_key {
    POST    $lfswap_client;
    default "";
}
map $request_method $lfswap_create_all {
    POST    all;
    default "";
}

limit_req_zone $lfswap_client zone=lfswap_api:10m rate=10r/s;
limit_req_zone $lfswap_create_key zone=lfswap_create_post:10m rate=6r/m;
limit_req_zone $lfswap_create_all zone=lfswap_create_all:1m rate=120r/m;
limit_req_zone $lfswap_client zone=lfswap_restore:10m rate=1r/s;
limit_req_zone $lfswap_client zone=lfswap_explorer:10m rate=5r/s;
limit_req_zone $lfswap_client zone=lfswap_donate:10m rate=2r/s;
limit_req_zone $lfswap_client zone=lfswap_graph:10m rate=20r/s;
limit_conn_zone $lfswap_client zone=lfswap_ws:10m;
limit_conn_zone $lfswap_client zone=lfswap_conn:10m;

# The app shell must be revalidated so an update reaches browsers; set here,
# because an add_header inside a location would drop the ones below.
map $uri $lfswap_cache_control {
    /index.html         "no-cache";
    /service-worker.js  "no-cache";
    # The network sky: meta.json names the current version; versions never
    # change once written
    /graph/meta.json    "no-cache";
    "~^/graph/v[0-9]+/" "public, max-age=31536000, immutable";
    default             "";
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream lfswap_boltzd  { server 127.0.0.1:9001; keepalive 8; }
upstream lfswap_sidecar { server 127.0.0.1:9005; keepalive 8; }
upstream lfswap_ws      { server 127.0.0.1:9004; }
upstream lfswap_donate  { server 127.0.0.1:9010; keepalive 4; }

# Requests for any other name (scanners by IP, forged Host headers) end
# here: no certificate is shown and nothing is served.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    access_log /var/log/lfswap/threat.log lfswap_threat;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
    access_log /var/log/lfswap/threat.log lfswap_threat;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name lightningfork.com www.lightningfork.com;
    access_log /var/log/nginx/access.log lfswap_privacy;
    access_log /var/log/lfswap/threat.log lfswap_threat if=$lfswap_threat;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://lightningfork.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lightningfork.com www.lightningfork.com;

    ssl_certificate /etc/letsencrypt/live/lightningfork.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lightningfork.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:lfswap_tls:10m;

    access_log /var/log/nginx/access.log lfswap_privacy;
    access_log /var/log/lfswap/threat.log lfswap_threat if=$lfswap_threat;

    if ($host = www.lightningfork.com) {
        return 301 https://lightningfork.com$request_uri;
    }

    # The preview password, until go-live: this file holds the auth_basic
    # lines, and going public empties it (scripts/install-host.sh keeps it as
    # it is when the config is installed again).
    include /etc/nginx/lfswap-preview.conf;

    # The web app keeps the user's rescue key in this origin's storage: only
    # its own scripts may run here. Styles may be inline attributes (the UI
    # framework sets them); fetch may reach any HTTPS host (LNURL and
    # Lightning addresses).
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss://lightningfork.com https:; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Cache-Control $lfswap_cache_control;

    client_max_body_size 64k;
    server_tokens off;

    # Slow or many connections from one client must not use up the workers
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 20s;
    send_timeout 20s;
    limit_conn lfswap_conn 30;

    root /srv/lfswap/webapp;
    index index.html;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The client's address stops at nginx: no service behind it needs it
    # (the limits are here), and what it never receives it cannot log.
    # Empty, so that a client's own X-Forwarded-For is not passed on either.
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # --- Swap API (boltz-backend) ---
    # The allowlist judges the normalised path ($uri). Refuse a raw path
    # (before any "?") that could differ from it, with encoded bytes, dot
    # segments or doubled slashes, instead of reasoning about both; the app
    # uses none of these. The API locations also forward $uri, not the raw
    # request line, so what is forwarded is what was allowed.
    if ($request_uri ~ "^[^?]*(%|//|/\.)") {
        return 400;
    }

    location = /v2/ws {
        limit_conn lfswap_ws 5;
        proxy_pass http://lfswap_ws/;
        # proxy_set_header here replaces the server's: repeat them
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    # The rescue page's search for swaps made with a rescue key.
    location = /v2/swap/restore {
        limit_except POST { deny all; }
        limit_req zone=lfswap_restore burst=5 nodelay;
        proxy_pass http://lfswap_sidecar$uri;
    }

    # Creating swaps is what costs the service; limit it harder.
    location ~ ^/v2/swap/(submarine|reverse)$ {
        if ($lfswap_api_ok = 0) { return 404; }
        # scripts/migrate/maintenance.sh on: refuse new swaps (POST) only.
        include /etc/nginx/lfswap-maintenance.conf;
        limit_req zone=lfswap_create_post burst=5 nodelay;
        limit_req zone=lfswap_create_all burst=30 nodelay;
        limit_req zone=lfswap_api burst=40 nodelay;
        proxy_pass http://lfswap_boltzd$uri$is_args$args;
    }

    location /v2/ {
        if ($lfswap_api_ok = 0) { return 404; }
        limit_req zone=lfswap_api burst=40 nodelay;
        proxy_pass http://lfswap_boltzd$uri$is_args$args;
    }

    # --- Donations: replay verdicts, channel donations ---
    # Creating a channel donation hands out an lnd address: limited like
    # creating a swap (the same zones), and its body is small
    location = /donate/v1/channel-orders {
        if ($lfswap_donate_ok = 0) { return 404; }
        client_max_body_size 4k;
        limit_req zone=lfswap_create_post burst=5 nodelay;
        limit_req zone=lfswap_create_all burst=30 nodelay;
        proxy_pass http://lfswap_donate$uri;
    }

    # Creating a SHA256-chain donation request hands out an address: the
    # same limits (the GET of /info and of a request fall under the next)
    location = /donate/v1/sha256 {
        if ($lfswap_donate_ok = 0) { return 404; }
        client_max_body_size 4k;
        limit_req zone=lfswap_create_post burst=5 nodelay;
        limit_req zone=lfswap_create_all burst=30 nodelay;
        proxy_pass http://lfswap_donate$uri;
    }

    location /donate/v1/ {
        if ($lfswap_donate_ok = 0) { return 404; }
        # A SHA256 donation's hint carries up to 20 BIP322 proofs
        client_max_body_size 16k;
        limit_req zone=lfswap_donate burst=10 nodelay;
        proxy_pass http://lfswap_donate$uri;
    }

    # --- The chain explorer, for the browser's refund path ---
    # mempool.guide follows the Bitcoin BLAKE2b chain; its Esplora API sends
    # no CORS headers, so the browser reaches it through this origin.
    # Whatever it answers is served from this origin, so it is answered as
    # inert data: TLS to it is verified, its headers that could act on this
    # origin are dropped, and the answer cannot be rendered as a page.
    location /explorer/api/ {
        if ($lfswap_explorer_ok = 0) { return 404; }
        limit_req zone=lfswap_explorer burst=20 nodelay;
        proxy_pass https://mempool.guide/api/;
        proxy_ssl_server_name on;
        proxy_ssl_name mempool.guide;
        proxy_ssl_verify on;
        # mempool.guide: leaf, YE1, Root YE, ISRG Root X2 on 2026-10-07; room for one more
        proxy_ssl_verify_depth 4;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host mempool.guide;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Content-Type;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Service-Worker-Allowed;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Link;
        proxy_hide_header Refresh;
        # An add_header here replaces the server's: repeat the ones that
        # matter, and make the answer plain text in a sandbox
        add_header Content-Type "text/plain; charset=utf-8" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }

    # --- The network sky's files (../graph, the "graph" service) ---
    # Static JSON, with gzip copies; nothing else under /graph/, and a
    # missing file is a 404, not the app
    location ^~ /graph/ {
        limit_except GET { deny all; }
        limit_req zone=lfswap_graph burst=100 nodelay;
        root /srv/lfswap;
        gzip_static on;
        try_files $uri =404;
    }

    # --- The web app (a single-page app) ---
    # Browsers fetch the app manifest without the preview password's
    # credentials; it only holds the app's name and icons
    location = /manifest.json {
        auth_basic off;
    }

    location / {
        try_files $uri /index.html;
    }
}
