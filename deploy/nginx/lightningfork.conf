# Lightning Fork Swap: the web app, the swap API and an explorer proxy, on
# one origin. The certificate comes from `certbot certonly --webroot -w
# /var/www/html` (see scripts/install-host.sh), renewed by certbot's timer.
#
# The preview password (auth_basic) stays on until go-live; remove the two
# auth_basic lines in the 443 server to open the site.

limit_req_zone $binary_remote_addr zone=lfswap_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=lfswap_create:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=lfswap_explorer:10m rate=5r/s;

# The app shell must be revalidated so an update reaches browsers; set here,
# because an add_header inside a location would drop the ones below.
map $uri $lfswap_cache_control {
    /index.html         "no-cache";
    /service-worker.js  "no-cache";
    default             "";
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream lfswap_boltzd  { server 127.0.0.1:9001; keepalive 8; }
upstream lfswap_sidecar { server 127.0.0.1:9005; keepalive 8; }
upstream lfswap_ws      { server 127.0.0.1:9004; }

server {
    listen 80;
    listen [::]:80;
    server_name lightningfork.com www.lightningfork.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://lightningfork.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lightningfork.com www.lightningfork.com;

    ssl_certificate /etc/letsencrypt/live/lightningfork.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lightningfork.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:lfswap_tls:10m;

    if ($host = www.lightningfork.com) {
        return 301 https://lightningfork.com$request_uri;
    }

    auth_basic "Lightning Fork Swap preview";
    auth_basic_user_file /etc/nginx/lfswap.htpasswd;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Cache-Control $lfswap_cache_control;

    client_max_body_size 64k;
    server_tokens off;

    root /srv/lfswap/webapp;
    index index.html;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # --- Swap API (boltz-backend) ---
    location = /v2/ws {
        proxy_pass http://lfswap_ws/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    location ~ ^/v2/(lightning|swap/rescue|swap/restore|asset) {
        limit_req zone=lfswap_api burst=20 nodelay;
        proxy_pass http://lfswap_sidecar;
    }

    location = /streamswapstatus {
        proxy_pass http://lfswap_sidecar;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Creating swaps is what costs the service; limit it harder.
    location ~ ^/v2/swap/(submarine|reverse)$ {
        limit_req zone=lfswap_create burst=5 nodelay;
        proxy_pass http://lfswap_boltzd;
    }

    location /v2/ {
        limit_req zone=lfswap_api burst=40 nodelay;
        proxy_pass http://lfswap_boltzd;
    }

    location = /version {
        proxy_pass http://lfswap_boltzd;
    }

    # --- The chain explorer, for the browser's refund path ---
    # mempool.guide follows the Bitcoin BLAKE2b chain; its Esplora API sends
    # no CORS headers, so the browser reaches it through this origin.
    location /explorer/api/ {
        limit_req zone=lfswap_explorer burst=20 nodelay;
        proxy_pass https://mempool.guide/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host mempool.guide;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
    }

    # --- The web app (a single-page app) ---
    location / {
        try_files $uri /index.html;
    }
}
